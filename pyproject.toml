[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statsbomb-tools"
version = "0.1.0"
description = "Reusable helpers for analysing StatsBomb open data"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "matplotlib", "mplsoccer", "statsbombpy"]

[tool.setuptools]
packages = ["statsbomb_tools"]
